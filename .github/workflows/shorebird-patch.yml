name: Shorebird Patch

# Manual only: dispatch after merging a Dart-only fix that should reach users
# without a new store/GitHub release. Patches cannot change native code,
# assets, plugins or the version number — bump pubspec.yaml and run the
# Shorebird Release workflow for those.
on:
  workflow_dispatch:
    inputs:
      release-version:
        description: 'Release to patch, e.g. 1.0.14+15 (latest = most recently updated release)'
        required: false
        default: latest
      track:
        description: 'Release track'
        required: false
        default: stable
        type: choice
        options: [stable, beta, staging]

permissions:
  contents: read

concurrency:
  group: shorebird-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Analyze/test with the same Flutter line the release was built with.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/football-release.jks
          cat > android/key.properties <<EOF
          storeFile=football-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # shorebird patch resolves the exact Flutter version recorded for the
      # release, so no --flutter-version flag here.
      - name: Create Shorebird patch
        id: patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release-version }}
          track: ${{ inputs.track }}

      - name: Summary
        run: |
          echo "### Patch published" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: \`${{ inputs.release-version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Patch: \`${{ steps.patch.outputs.patch-number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Track: \`${{ inputs.track }}\`" >> "$GITHUB_STEP_SUMMARY"
