name: Shorebird Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorebird-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *//p' pubspec.yaml | head -1 | tr -d '\r')
          NAME=${VERSION%%+*}
          CODE=${VERSION##*+}
          [ "$CODE" = "$VERSION" ] && CODE=0
          echo "full=$VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building v$NAME ($CODE)"

      # Shorebird releases are immutable: the same version cannot be uploaded
      # twice. Pushing a Dart-only fix without bumping pubspec should go
      # through the Shorebird Patch workflow instead of failing here.
      - name: Check for an existing release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$TAG already exists, skipping. Use the Shorebird Patch workflow for Dart-only fixes."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.exists == 'false'
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1
        if: steps.check.outputs.exists == 'false'
        with:
          cache: true

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: flutter pub get

      - name: Analyze
        if: steps.check.outputs.exists == 'false'
        run: flutter analyze

      - name: Test
        if: steps.check.outputs.exists == 'false'
        run: flutter test

      - name: Configure signing
        if: steps.check.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/football-release.jks
          cat > android/key.properties <<EOF
          storeFile=football-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Builds with the exact Flutter version pinned above so later patches can
      # target this release. The APK it produces is the patchable baseline.
      - name: Build Shorebird release
        id: shorebird
        if: steps.check.outputs.exists == 'false'
        uses: shorebirdtech/shorebird-release@v1
        with:
          platform: android
          flutter-version: '3.41.9'
          args: --artifact=apk

      - name: Rename APK
        if: steps.check.outputs.exists == 'false'
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          if [ ! -f "$APK" ]; then
            APK=$(find build -name '*.apk' | head -1)
          fi
          test -n "$APK"
          cp "$APK" "football-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}.apk"

      - name: Publish GitHub release
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          name: v${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          body: |
            版本 ${{ steps.version.outputs.name }}（build ${{ steps.version.outputs.code }}）
            Commit: ${{ github.sha }}

            此版本由 Shorebird 构建，可接收后续 Dart 代码热更新补丁。
          files: football-v*.apk
          fail_on_unmatched_files: true
          make_latest: true
